<!DOCTYPE html>
<html>
<head>
    <script>
        var userLang = navigator.language || navigator.userLanguage; 
        userLang = userLang.split('-')[0];
        var supported = ['en', 'es', 'fr', 'de', 'pt', 'ru', 'ar', 'ja', 'ko', 'it', 'tr', 'hi', 'bn', 'id', 'vi', 'th', 'pl', 'nl', 'fa', 'ur', 'ms', 'tl', 'he', 'el', 'cs', 'hu', 'ro', 'sv', 'da', 'fi', 'no', 'uk', 'bg', 'hr', 'sr', 'sk', 'sl', 'lt', 'et', 'lv', 'sw', 'ha', 'zu', 'ta', 'kk'];
        if (supported.indexOf(userLang) > -1) {
            window.location.href = './' + userLang + '/index.html';
        } else {
            window.location.href = './en/index.html';
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
